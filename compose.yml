# Production Compose: Full-stack containerization with network isolation.
services:
  postgres:
    image: postgres:16-alpine
    container_name: microstore-db
    # Restart policy ensures high availability in production environments.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Database is a backend service.
    # No ports exposed for database and backend services to ensure network isolation.
    # Access is only possible through the frontend container.
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microstore-net

  auth-service:
    build: ./services/auth
    container_name: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microstore-net

  product-service:
    build: ./services/product
    container_name: product-service
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/product_db
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microstore-net

  order-service:
    build: ./services/order
    container_name: order-service
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_db
      - PRODUCT_SERVICE_URL=http://product-service:${PORT}
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microstore-net

  frontend:
    build: ./frontend
    container_name: microstore-frontend
    restart: unless-stopped
    ports:
      # Only frontend exposes a port to the host.
      - "3000:${PORT}"
    env_file: .env
    environment:
      - AUTH_SERVICE_URL=${PROD_AUTH_URL}
      - PRODUCT_SERVICE_URL=${PROD_PRODUCT_URL}
      - ORDER_SERVICE_URL=${PROD_ORDER_URL}
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - microstore-net

networks:
  microstore-net:
    driver: bridge
